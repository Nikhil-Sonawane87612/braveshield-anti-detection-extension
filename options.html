<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BraveShield Bypass Pro - Settings</title>
  <style>
    body { background: #0b0f19; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; padding: 32px; max-width: 800px; margin: 0 auto; }
    h1 { color: #38bdf8; font-size: 24px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
    p { color: #94a3b8; margin-bottom: 24px; font-size: 14px; }
    .section { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .section-title { font-size: 16px; font-weight: 700; color: #f8fafc; margin-bottom: 12px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
    select, input[type="text"] { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: white; font-size: 13px; box-sizing: border-box; }
    .check-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 14px; }
    .check-row input { width: 18px; height: 18px; accent-color: #0284c7; }
    .save-btn { background: #0284c7; color: white; padding: 12px 24px; border: none; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; }
    .save-btn:hover { background: #0369a1; }
    .toast { background: #10b981; color: white; padding: 8px 16px; border-radius: 6px; display: inline-block; margin-left: 12px; font-weight: 600; opacity: 0; transition: opacity 0.3s; }
  </style>
</head>
<body>
  <h1>⚙️ BraveShield Bypass Pro Settings</h1>
  <p>Configure anti-detection profiles and stealth parameters to fool all anti-adblockers while keeping Brave Shields ON.</p>

  <div class="section">
    <div class="section-title">Detection Bypass Modules</div>
    <div class="check-row">
      <input type="checkbox" id="mask-brave" checked>
      <label for="mask-brave" style="margin:0;">Mask navigator.brave API (Hides Brave runtime)</label>
    </div>
    <div class="check-row">
      <input type="checkbox" id="bypass-traps" checked>
      <label for="bypass-traps" style="margin:0;">Shields ON DOM Ad-Block Trap Neutralizer (Hooks offsetHeight/getBoundingClientRect)</label>
    </div>
    <div class="check-row">
      <input type="checkbox" id="stub-vars" checked>
      <label for="stub-vars" style="margin:0;">Analytics & Ad Network Variable Stubs (window.adsbygoogle, window.ga, window.googletag)</label>
    </div>
    <div class="check-row">
      <input type="checkbox" id="mask-brands" checked>
      <label for="mask-brands" style="margin:0;">UserAgent Client Hints Brand Sanitizer (Removes Brave from brands list)</label>
    </div>
    <div class="check-row">
      <input type="checkbox" id="normalize-webgl" checked>
      <label for="normalize-webgl" style="margin:0;">WebGL Hardware Vendor Normalization (Overrides farbled vendor response)</label>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Hardware & GPU Profile Spoofing</div>
    <div class="form-group">
      <label>Spoofed WebGL Vendor String</label>
      <input type="text" id="webgl-vendor" value="Google Inc. (NVIDIA)">
    </div>
    <div class="form-group">
      <label>Spoofed WebGL Renderer String</label>
      <input type="text" id="webgl-renderer" value="ANGLE (NVIDIA, NVIDIA GeForce RTX 3060 Direct3D11 vs_5_0 ps_5_0, D3D11)">
    </div>
  </div>

  <button class="save-btn" id="save-settings">Save Options</button>
  <span class="toast" id="toast">Settings Saved!</span>

  <script src="options.js"></script>
</body>
</html>

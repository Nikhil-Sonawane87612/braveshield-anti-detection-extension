<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BraveShield Bypass Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { width: 340px; background: #0f172a; color: #f8fafc; padding: 16px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; border-bottom: 1px solid #1e293b; padding-bottom: 12px; }
    .title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; color: #38bdf8; }
    .badge { background: rgba(16, 185, 129, 0.2); color: #34d399; font-size: 10px; padding: 2px 8px; borderRadius: 12px; font-weight: 600; border: 1px solid rgba(16, 185, 129, 0.3); }
    .card { background: #1e293b; border-radius: 10px; padding: 12px; margin-bottom: 12px; border: 1px solid #334155; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 500; }
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .3s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #0284c7; }
    input:checked + .slider:before { transform: translateX(20px); }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; text-align: center; }
    .stat-box { background: #0f172a; padding: 8px; border-radius: 6px; border: 1px solid #334155; }
    .stat-val { font-size: 18px; font-weight: 700; color: #38bdf8; }
    .stat-lbl { font-size: 10px; color: #94a3b8; margin-top: 2px; }
    .btn { display: block; width: 100%; padding: 10px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; text-align: center; text-decoration: none; margin-top: 8px; }
    .btn:hover { background: #0369a1; }
    .status-text { font-size: 11px; color: #94a3b8; margin-top: 6px; display: flex; align-items: center; gap: 4px; }
    .dot { width: 6px; height: 6px; background: #34d399; border-radius: 50%; display: inline-block; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      BraveShield Bypass
    </div>
    <span class="badge" id="mode-badge">SHIELDS ON SAFE</span>
  </div>

  <div class="card">
    <div class="toggle-row">
      <span>Anti-Detection Engine</span>
      <label class="switch">
        <input type="checkbox" id="main-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="status-text">
      <span class="dot"></span>
      <span id="domain-status">Active on current website</span>
    </div>
  </div>

  <div class="card">
    <div class="toggle-row" style="margin-bottom: 8px;">
      <span>Shields ON Trap Bypass</span>
      <span style="color:#34d399; font-size:11px; font-weight:bold;">Active</span>
    </div>
    <div style="font-size: 11px; color: #94a3b8;">
      Neutralizes adblock traps, missing analytics variables & canvas/WebGL farbling without turning off Brave Shields.
    </div>
    <div class="stats">
      <div class="stat-box">
        <div class="stat-val" id="traps-bypassed">18</div>
        <div class="stat-lbl">Traps Neutralized</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="api-masked">100%</div>
        <div class="stat-lbl">Chrome Replica</div>
      </div>
    </div>
  </div>

  <a href="options.html" target="_blank" class="btn">Open Advanced Options</a>

  <script src="popup.js"></script>
</body>
</html>
